<!DOCTYPE html>
<html>

  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Watch List</title>
    <link rel="stylesheet" href="search.css" />
    <script src="https://kit.fontawesome.com/d262db8908.js" crossorigin="anonymous"></script>
  </head>

  <body>

    <header>

      <h1>Find your film</h1>
      <ul>
        <li><a href="#">My Watchlist</a></li>
      </ul>

      <section id="search-bar" class="search-bar">
        <div class="input-container">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search" placeholder="Search for a movie" required />
        </div>
        <button type="submit" id="search-btn">Search</button>
      </section>

    </header>

    <main>
      <section class="empty-list">
        <div>
          <i class="fa-solid fa-film"></i>
          <p>Start exploring</p>
        </div>
      </section>
    </main>

  </body>

  <script src="search.js" type="module"></script>

</html>
