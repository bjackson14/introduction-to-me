<!DOCTYPE html>
<html>

  <head>
    <link rel="stylesheet" href="oldagram.css" />
  </head>

  <body>

    <header>
      <img class="logo" src="/assets/imgs/logo.png" alt="Oldagram logo"/>
      <img class="user" src="/assets//imgs/me.jpg" alt="Avatar of user">
    </header>

    <main>

      <section>
        <div class="user-info">
          <img class="user" src="/assets/imgs/avatar-vangogh.jpg" alt="Avatar of poster" />
          <div>
            <p class="name">Vincent van Gogh</p>
            <p class="location">Zudert, Netherlands</p>
          </div>
        </div>
        <img class="post" src="/assets/imgs/post-vangogh.jpg" alt="Selfie of poster" />
        <div class="footer">
          <img class="icon" src="/assets/imgs/icon-heart.png" alt="Heart icon" />
          <img class="icon" src="/assets/imgs/icon-comment.png" alt="Comment icon" />
          <img class="icon" src="/assets/imgs/icon-dm.png" alt="Direct Message icon" />
          <p class="likes">21,492 likes</p>
          <p class="comment-name">vincey1853 <span class="comment">just took a few mushrooms lol</span></p>
        </div>
      </section>

    </main>

    <script src="oldagram.js"></script>

  </body>

</html>
