<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="score-counter.css" />
        <script src="index.js"></script>
    </head>
    <body>
        <div class="container">
            <div>
                <h3 class="title">HOME</h3>
                <p id="home-score" class="score">0</p>
                <div class="score-buttons">
                  <button id="home-1" class="add-btn">+1</button>
                  <button id="home-2" class="add-btn">+2</button>
                  <button id="home-3" class="add-btn">+3</button>
                </div>
            </div>
            <div>
                <h3 class="title">GUEST</h3>
                <p id="guest-score" class="score">0</p>
                <div class="score-buttons">
                  <button id="home-1" class="add-btn">+1</button>
                  <button id="home-2" class="add-btn">+2</button>
                  <button id="home-3" class="add-btn">+3</button>
                </div>
            </div>
        </div>
    </body>
</html>
